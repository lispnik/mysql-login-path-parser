name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install SBCL
      run: |
        sudo apt-get update
        sudo apt-get install -y sbcl curl
        sbcl --version

    - name: Install ocicl
      run: |
        curl -fsSL https://ocicl.github.io/ocicl/deb-repo/ocicl-archive-keyring.gpg | sudo tee /usr/share/keyrings/ocicl-archive-keyring.asc > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/ocicl-archive-keyring.asc] https://ocicl.github.io/ocicl/deb-repo stable main" | sudo tee /etc/apt/sources.list.d/ocicl.list
        sudo apt update
        sudo apt install ocicl
        ocicl setup
        ocicl version

    - name: Install dependencies
      run: |
        ocicl install ironclad babel fiveam

    - name: Setup SBCL runtime
      run: |
        cat > ~/.sbclrc << 'EOF'
        ;; ocicl integration for CI
        #-ocicl
        (when (probe-file #P"/home/runner/.local/share/ocicl/ocicl-runtime.lisp")
          (load #P"/home/runner/.local/share/ocicl/ocicl-runtime.lisp"))
        (asdf:initialize-source-registry
          (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))
        EOF

    - name: Run tests
      run: |
        sbcl --non-interactive \
             --eval "(asdf:load-system :mysql-login-path-parser/tests)" \
             --eval "(unless (mysql-login-path-parser.tests:run-mysql-tests) (quit 1))"