name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install SBCL
      run: |
        sudo apt-get update
        sudo apt-get install -y sbcl curl
        sbcl --version

    - name: Install ocicl
      run: |
        # Download specific release version
        wget https://github.com/ocicl/ocicl/releases/download/v2.16.13/ocicl-linux
        chmod +x ocicl-linux
        sudo mv ocicl-linux /usr/local/bin/ocicl
        ocicl version

    - name: Install dependencies
      run: |
        ocicl install ironclad split-sequence alexandria fiveam

    - name: Run tests
      run: |
        sbcl --non-interactive \
             --eval "(asdf:load-system :mysql-login-path-parser/tests)" \
             --eval "(mysql-login-path-parser.tests:run-all-tests)" \
             --eval "(if (mysql-login-path-parser.tests:run-all-tests) (quit 0) (quit 1))"