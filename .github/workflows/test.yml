name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install SBCL
      run: |
        sudo apt-get update
        sudo apt-get install -y sbcl curl
        sbcl --version

    - name: Install ocicl
      run: |
        curl -fsSL https://ocicl.github.io/ocicl/deb-repo/ocicl-archive-keyring.gpg | sudo tee /usr/share/keyrings/ocicl-archive-keyring.asc > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/ocicl-archive-keyring.asc] https://ocicl.github.io/ocicl/deb-repo stable main" | sudo tee /etc/apt/sources.list.d/ocicl.list
        sudo apt update
        sudo apt install ocicl
        ocicl setup
        ocicl version

    - name: Install dependencies
      run: |
        ocicl install ironclad split-sequence alexandria fiveam

    - name: Run tests
      run: |
        sbcl --non-interactive \
             --eval "(require :asdf)" \
             --eval "(push (truename \".\") asdf:*central-registry*)" \
             --eval "(asdf:load-system :mysql-login-path-parser/tests)" \
             --eval "(unless (mysql-login-path-parser.tests:run-all-tests) (quit 1))"