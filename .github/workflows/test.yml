name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install SBCL
      run: |
        sudo apt-get update
        sudo apt-get install -y sbcl curl
        sbcl --version

    - name: Install ocicl
      run: |
        # Download latest release
        RELEASE_URL=$(curl -s https://api.github.com/repos/ocicl/ocicl/releases/latest | grep "browser_download_url.*ocicl-linux" | cut -d '"' -f 4)
        echo "Downloading ocicl from: $RELEASE_URL"
        curl -L "$RELEASE_URL" > ocicl
        chmod +x ocicl
        sudo mv ocicl /usr/local/bin/
        ocicl version

    - name: Install dependencies
      run: |
        ocicl install ironclad split-sequence alexandria fiveam

    - name: Run tests
      run: |
        sbcl --non-interactive \
             --eval "(asdf:load-system :mysql-login-path-parser/tests)" \
             --eval "(mysql-login-path-parser.tests:run-all-tests)" \
             --eval "(if (mysql-login-path-parser.tests:run-all-tests) (quit 0) (quit 1))"